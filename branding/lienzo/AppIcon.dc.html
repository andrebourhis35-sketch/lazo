<linearGradient id="rib" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2A50F0"></stop><stop offset="0.5" stop-color="#4A86FF"></stop><stop offset="1" stop-color="#35D6C1"></stop></linearGradient>

</div>
<div style="display: flex; gap: 24px; justify-content: center; align-items: flex-end">

<div style="width: 24px; height: 24px; border-radius: 6px; background: linear-gradient(160deg, #1D2A6B 0%, #060918 100%); display: flex; align-items: center; justify-content: center"><svg width="20" height="14" viewBox="60 100 360 252" aria-hidden="true"><use href="#orb"></use></svg></div>
<span style="font-size: 12px; font-weight: 600; color: #475467">64 · 40 · 24 px</span>
</div>

<div style="height: 1px; background: #E4E7EC; margin: 8px 0"></div>

<span style="font-size: 13px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: #475467">Versión simplificada</span>
<div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px">
<svg width="300" height="238" viewBox="0 0 480 380" role="img" aria-label="Isotipo plano de LAZO en dos colores">
<g transform="translate(240 190) rotate(-14)"><use href="#ribPath" fill="#2A50F0"></use></g>
<circle cx="240" cy="190" r="100" fill="#345CFF"></circle>
<g transform="translate(240 190) rotate(-14)" clip-path="url(#frontClip)"><use href="#ribPath" fill="#F5F7FB" stroke="#F5F7FB" stroke-width="16"></use><use href="#ribPath" fill="#35D6C1"></use></g>
</svg>
<p style="margin: 0; font-size: 14px; font-weight: 500; line-height: 1.5; text-align: center; color: #475467">Para tamaños pequeños, sellos, bordados<br>e impresión a una o dos tintas.</p>
</div>
