<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>LAZO · CRM Conversaciones</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2443CC}a:hover{color:#14216E}
</style>
</helmet>
<div style="min-height: 900px; display: flex; flex-wrap: wrap; background: #F5F7FB; color: #101828; font-family: 'Manrope', system-ui, sans-serif">
<svg width="0" height="0" style="position: absolute" aria-hidden="true">
<defs>
<radialGradient id="sph" cx="0.35" cy="0.28" r="0.8"><stop offset="0" stop-color="#E4EBFF"></stop><stop offset="0.16" stop-color="#8EA8FF"></stop><stop offset="0.45" stop-color="#3D6BFF"></stop><stop offset="0.78" stop-color="#1C2DB8"></stop><stop offset="1" stop-color="#0B1150"></stop></radialGradient>
<radialGradient id="sphRim" cx="0.8" cy="0.85" r="0.55"><stop offset="0" stop-color="#35D6C1" stop-opacity="0.6"></stop><stop offset="1" stop-color="#35D6C1" stop-opacity="0"></stop></radialGradient>
<linearGradient id="rib" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2A50F0"></stop><stop offset="0.5" stop-color="#4A86FF"></stop><stop offset="1" stop-color="#35D6C1"></stop></linearGradient>
<path id="ribPath" fill-rule="evenodd" d="M-170 0 A170 62 0 1 0 170 0 A170 62 0 1 0 -170 0 Z M-140 -6 A140 34 0 1 1 140 -6 A140 34 0 1 1 -140 -6 Z"></path>
<clipPath id="frontClip"><rect x="-200" y="-2" width="400" height="120"></rect></clipPath>
<g id="orb">
<g transform="translate(240 190) rotate(-14)"><use href="#ribPath" fill="url(#rib)"></use><use href="#ribPath" fill="#0B1150" opacity="0.35"></use></g>
<circle cx="240" cy="190" r="100" fill="url(#sph)"></circle>
<circle cx="240" cy="190" r="100" fill="url(#sphRim)"></circle>
<g transform="translate(240 190) rotate(-14)" clip-path="url(#frontClip)"><use href="#ribPath" fill="url(#rib)"></use></g>
</g>
</defs>
</svg>

<aside style="flex: 1 1 220px; max-width: 260px; box-sizing: border-box; padding: 24px 16px; background: #FFFFFF; border-right: 1px solid #E4E7EC; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; align-items: center; gap: 8px; padding: 0 8px"><svg width="40" height="28" viewBox="60 100 360 252" aria-hidden="true"><use href="#orb"></use></svg><span style="font-size: 26px; font-weight: 700">lazo</span></div>
<nav aria-label="Principal" style="display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{ nav }}" as="item" hint-placeholder-count="7">
<button type="button" onClick="{{ item.pick }}" style="{{ item.style }}">
<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{ item.icon }}"></path></svg>
<span>{{ item.label }}</span>
</button>
</sc-for>
</nav>
</aside>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 20px 24px; display: flex; flex-direction: column; gap: 20px">
<header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<h1 style="margin: 0; font-size: 24px; font-weight: 700">{{ section }}</h1>
<div style="display: flex; align-items: center; gap: 8px">
<button type="button" aria-label="Buscar" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #E4E7EC; background: #FFFFFF; color: #101828; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg></button>
<button type="button" aria-label="Notificaciones" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #E4E7EC; background: #FFFFFF; color: #101828; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg></button>
<div style="width: 40px; height: 40px; border-radius: 999px; background: #101828; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700">A</div>
</div>
</header>

<div style="flex: 1; display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<section aria-label="Lista de conversaciones" style="flex: 1 1 380px; min-width: 0; box-sizing: border-box; padding: 16px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E4E7EC; display: flex; flex-direction: column; gap: 12px">
<div role="tablist" style="display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid #E4E7EC">
<sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4">
<button type="button" role="tab" onClick="{{ t.pick }}" style="{{ t.style }}">{{ t.label }}</button>
</sc-for>
</div>
<sc-for list="{{ chats }}" as="c" hint-placeholder-count="4">
<button type="button" onClick="{{ c.pick }}" style="{{ c.style }}">
<span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 999px; background: {{ c.avatarBg }}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700">{{ c.initials }}</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; text-align: left">
<span style="font-size: 15px; font-weight: 700">{{ c.name }}</span>
<span style="font-size: 13px; font-weight: 500; color: #475467; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ c.preview }}</span>
</span>
<span style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px">
<span style="font-size: 12px; font-weight: 600; color: #475467">{{ c.time }}</span>
<sc-if value="{{ c.unread }}" hint-placeholder-val="{{ true }}"><span style="min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: #345CFF; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{ c.unread }}</span></sc-if>
</span>
</button>
</sc-for>
</section>

<section aria-label="Detalle del cliente" style="flex: 1 1 320px; min-width: 0; box-sizing: border-box; padding: 20px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E4E7EC; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 48px; height: 48px; border-radius: 999px; background: {{ active.avatarBg }}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700">{{ active.initials }}</span>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 17px; font-weight: 700">{{ active.name }}</span><span style="font-size: 13px; font-weight: 500; color: #475467">WhatsApp</span></div>
</div>
<span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: #E6FBF7; color: #0B6B5E; font-size: 13px; font-weight: 700"><span style="width: 8px; height: 8px; border-radius: 999px; background: #0E8A7A"></span>{{ active.stage }}</span>
<div style="padding: 14px; border-radius: 14px; background: #F5F7FB; font-size: 14px; font-weight: 500; line-height: 1.5">{{ active.preview }}</div>
<div style="box-sizing: border-box; padding: 16px; border-radius: 16px; background: linear-gradient(160deg, #EEF2FF 0%, #E9FBF8 100%); border: 1px solid #DCE3FF; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.2 7.3 7.3 2.2-7.3 2.2-2.2 7.3-2.2-7.3-7.3-2.2 7.3-2.2z" fill="#345CFF"></path></svg><span style="font-size: 14px; font-weight: 700">IA asistente</span></div>
<span style="font-size: 14px; font-weight: 500; line-height: 1.5; color: #344054">{{ active.suggestion }}</span>
<button type="button" onClick="{{ generate }}" style="height: 44px; border: none; border-radius: 12px; background: #345CFF; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; box-shadow: 0 8px 20px rgba(52,92,255,0.3)">{{ generateLabel }}</button>
</div>
<div style="display: flex; gap: 8px; align-items: center">
<label for="msg" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Escribe un mensaje</label>
<input id="msg" type="text" placeholder="Escribe un mensaje…" style="flex: 1; min-width: 0; height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #D0D5DD; background: #FFFFFF; font-family: inherit; font-size: 14px; color: #101828">
<button type="button" aria-label="Enviar" style="width: 44px; height: 44px; flex-shrink: 0; border: none; border-radius: 999px; background: #345CFF; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 12l16-8-6 16-2-6z"></path></svg></button>
</div>
</section>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { nav: 'Conversaciones', tab: 'Todas', chat: 0, generated: false };
}
renderVals() {
const icons = {
'Conversaciones': 'M4 5h16v11H9l-5 4z',
'Clientes': 'M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM3 20c0-3.5 2.7-6 6-6s6 2.5 6 6M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2 .8 3 2.8 3 6',
'Ventas': 'M5 8h14l-1 12H6zM9 8a3 3 0 0 1 6 0',
'Automatizaciones': 'M13 3L5 14h6l-1 7 8-11h-6z',
'IA': 'M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z',
'Reportes': 'M4 20V10M10 20V4M16 20v-7M2 20h20',
'Equipo': 'M8 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM16 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM2 20c0-3 2.7-5 6-5s6 2 6 5M14 15.5c.6-.3 1.3-.5 2-.5 3.3 0 6 2 6 5'
};
const nav = Object.keys(icons).map((label) => {
const on = this.state.nav === label;
return {
label, icon: icons[label],
pick: () => this.setState({ nav: label }),
style: 'display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border: none; border-radius: 12px; font-family: inherit; font-size: 14px; font-weight: ' + (on ? '700' : '500') + '; text-align: left; background: ' + (on ? '#EEF2FF' : 'transparent') + '; color: ' + (on ? '#2443CC' : '#344054')
};
});
const tabs = ['Todas', 'No leídas', 'Asignadas', 'Etiquetas'].map((label) => {
const on = this.state.tab === label;
return {
label, pick: () => this.setState({ tab: label }),
style: 'height: 44px; padding: 0 12px; border: none; background: transparent; font-family: inherit; font-size: 14px; font-weight: ' + (on ? '700' : '500') + '; color: ' + (on ? '#2443CC' : '#475467') + '; box-shadow: ' + (on ? 'inset 0 -2px 0 #345CFF' : 'none')
};
});
const data = [
{ name: 'María López', initials: 'ML', avatarBg: '#345CFF', preview: 'Hola, me interesa más información del proyecto.', time: '11:24', unread: 1, stage: 'Cliente potencial', suggestion: 'Responder consulta sobre precios y disponibilidad del proyecto.' },
{ name: 'Carlos Ramírez', initials: 'CR', avatarBg: '#0E8A7A', preview: '¿Tienen disponibilidad para marzo?', time: '10:18', unread: 0, stage: 'Calificado', suggestion: 'Compartir el calendario de disponibilidad de marzo.' },
{ name: 'Constructora Sur', initials: 'CS', avatarBg: '#101828', preview: 'Gracias, quedo atento.', time: '09:42', unread: 0, stage: 'Propuesta enviada', suggestion: 'Programar seguimiento de la propuesta para mañana.' },
{ name: 'Lucía Torres', initials: 'LT', avatarBg: '#6A8DFF', preview: '¿Me puedes enviar el brochure?', time: 'Ayer', unread: 0, stage: 'Nuevo', suggestion: 'Enviar el brochure y preguntar por su presupuesto.' }
];
const chats = data.map((c, i) => {
const on = this.state.chat === i;
return Object.assign({}, c, {
pick: () => this.setState({ chat: i, generated: false }),
style: 'display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px; border-radius: 14px; border: 1px solid ' + (on ? '#C7D3FF' : 'transparent') + '; background: ' + (on ? '#F3F6FF' : 'transparent') + '; font-family: inherit; color: #101828'
});
});
return {
nav, tabs, chats,
section: this.state.nav,
active: data[this.state.chat],
generate: () => this.setState({ generated: true }),
generateLabel: this.state.generated ? 'Respuesta lista ✓' : 'Generar respuesta'
};
}
}
</script>
</body>
</html>
